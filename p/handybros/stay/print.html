<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print the welcome card · demo for HandyBros</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  @page { size: A5 portrait; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  :root { --ink: #15303D; --cream: #FFF6E6; --butter: #F4D27A; --coral: #F0A39B; --sea: #2B6E8F; --paper: #FFFBF2; --head: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif; --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { margin: 0; background: #FBEBCF; color: var(--ink); font: 400 14px/1.5 var(--body); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 6px var(--butter); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; padding: 14px 16px; background: var(--ink); color: var(--cream); border-bottom: 3px solid var(--ink); }
  .bar p { margin: 0; font-size: 15px; font-weight: 600; }
  .bar button, .bar a { min-height: 46px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 999px; background: var(--butter); color: var(--ink); font: 800 15px/1 var(--body); border: 3px solid var(--cream); text-decoration: none; cursor: pointer; box-shadow: 3px 3px 0 rgb(0 0 0 / .35); transition: transform .15s, box-shadow .15s; }
  .bar button:hover, .bar a:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 rgb(0 0 0 / .35); background: var(--coral); }
  .bar a.q { background: transparent; color: var(--cream); }
  .bar a.q:hover { background: var(--cream); color: var(--ink); }
  .stage { display: grid; place-items: center; padding: 28px 12px 40px; }
  .card { width: 148mm; height: 210mm; background: var(--paper); position: relative; padding: 10mm; box-shadow: 8px 8px 0 var(--ink); border: 3px solid var(--ink); }
  .frame { height: 100%; border: 1.4mm solid var(--ink); outline: .5mm solid var(--ink); outline-offset: 1.6mm; position: relative; display: flex; flex-direction: column; align-items: center; padding: 9mm 8mm 8mm; text-align: center; border-radius: 6mm; }
  .frame::before, .frame::after { content: ''; position: absolute; left: 50%; width: 24mm; height: 4mm; margin-left: -12mm; background: var(--butter); border: .8mm solid var(--ink); border-radius: 2mm; }
  .frame::before { top: -3mm; }
  .frame::after { bottom: -3mm; background: var(--coral); }
  .mark { display: inline-grid; place-items: center; width: 11mm; height: 11mm; border-radius: 50%; border: .8mm solid var(--ink); background: var(--butter); color: var(--ink); font: 800 9.5pt/1 var(--head); }
  .eyebrow { font: 800 7.5pt/1 var(--body); letter-spacing: .18em; text-transform: uppercase; margin-top: 4mm; color: var(--sea); display: flex; align-items: center; gap: 2mm; }
  .eyebrow::before, .eyebrow::after { content: ''; width: 7mm; height: .8mm; border-radius: 1mm; background: var(--coral); }
  h1 { font: 800 31pt/1 var(--head); letter-spacing: -.02em; margin: 5mm 0 0; font-variation-settings: 'opsz' 96; text-wrap: balance; }
  .qr { width: 78mm; height: 78mm; margin: 7mm 0 0; padding: 3mm; background: #fff; border: 1mm solid var(--ink); border-radius: 4mm; box-shadow: 1.8mm 1.8mm 0 var(--ink); }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .name { font: 800 20pt/1.1 var(--head); letter-spacing: -.01em; margin: 8mm 0 0; }
  .hint { margin: 2mm 0 0; font-size: 10.5pt; font-weight: 600; }
  .wifi { margin-top: auto; font: 700 8.5pt/1.4 var(--body); padding: 2.5mm 4mm; border: .5mm dashed var(--ink); border-radius: 999px; background: rgb(244 210 122 / .35); }
  .demo { margin: 3mm 0 0; font: 600 7pt/1.3 var(--body); color: #3B5461; }
  @media print {
    body { background: none; }
    .bar { display: none; }
    .stage { padding: 0; display: block; }
    .card { box-shadow: none; border: 0; margin: 0; page-break-after: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 600px) { .card { zoom: .6; } }
  @media (prefers-reduced-motion: reduce) { .bar button, .bar a { transition: none; } }
</style>
</head>
<body>
<div class="bar"><p>Print this on A5. Frame it and keep it inside the front door.</p><button type="button" id="print">Print the card</button><a class="q" id="back" href="index.html">Open the guest page</a></div>
<div class="stage">
  <article class="card" aria-label="Welcome card">
    <div class="frame">
      <span class="mark" aria-hidden="true">HB</span>
      <div class="eyebrow">Welcome</div>
      <h1>Scan for your welcome guide</h1>
      <div class="qr"><img id="qr" alt="QR code that opens the welcome guide" src="qr-yellow-door.svg"></div>
      <div class="name" id="name">The Yellow Door</div>
      <p class="hint">Point your phone camera at the code.</p>
      <div class="wifi" id="wifi">Wifi details are in the guide</div>
      <p class="demo">Demo card made for HandyBros</p>
    </div>
  </article>
</div>
<script src="js/data.js"></script>
<script>
  (function () {
    var D = window.StayData, p = new URLSearchParams(location.search).get('p') || 'yellow-door';
    if (!D.has(p)) p = 'yellow-door';
    var d = D.load(p);
    document.getElementById('qr').src = 'qr-' + p + '.svg';
    document.getElementById('name').textContent = d.name;
    var ssid = d.wifi && String(d.wifi.ssid || '').trim();
    document.getElementById('wifi').textContent = ssid ? 'Wifi network: ' + ssid + '. The password is in the guide.' : 'Wifi details are in the guide';
    document.getElementById('back').href = 'index.html?p=' + encodeURIComponent(p);
    document.getElementById('print').addEventListener('click', function () { window.print(); });
  })();
</script>
</body>
</html>
