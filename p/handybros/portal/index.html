<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandyBros portal, clickable prototype</title>
<meta name="description" content="A clickable, no-backend prototype of the HandyBros operator console and owner portal. All data is sample data.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600;650;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/op.css">
<link rel="stylesheet" href="css/ow.css">
<link rel="stylesheet" href="css/runner.css">
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Sidebar"></aside>
  <div class="side-scrim" data-act="nav-close"></div>
  <div class="mainwrap" style="min-width:0">
    <header class="top" id="top"></header>
    <main id="main" class="content" tabindex="-1"></main>
  </div>
</div>

<div class="drawer" id="drawer" role="complementary" aria-label="Turnover runner, phone view">
  <div class="drawer-head">
    <h2>Turnover runner</h2><span class="muted" style="font-size:13px">Tick things off, then look at the owner side</span><span class="sp"></span>
    <button class="btn btn-ghost btn-sm" data-act="runner-full">Full screen</button>
    <button class="btn btn-ghost btn-icon btn-sm" data-act="drawer-close" aria-label="Close the runner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="drawer-body">
    <div class="phone" aria-label="Phone frame">
      <div class="phone-bar" aria-hidden="true"><span class="phone-clock mono">14:20</span><i class="notch"></i><span class="phone-icons"><i></i><i></i><i class="batt"></i></span></div>
      <div class="rn-host" data-mode="drawer"></div>
      <i class="phone-home" aria-hidden="true"></i>
    </div>
  </div>
</div>
<div id="runner-full"><div class="rn-host" data-mode="full"></div></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/model.js"></script>
<script src="js/op-today.js"></script>
<script src="js/op-calendar.js"></script>
<script src="js/op-properties.js"></script>
<script src="js/op-quotes.js"></script>
<script src="js/op-compliance.js"></script>
<script src="js/op-keys.js"></script>
<script src="js/op-billing.js"></script>
<script src="js/op-inbox.js"></script>
<script src="js/op-reports.js"></script>
<script src="js/op-settings.js"></script>
<script src="js/ow-overview.js"></script>
<script src="js/ow-requests.js"></script>
<script src="js/ow-properties.js"></script>
<script src="js/ow-vault.js"></script>
<script src="js/ow-billing.js"></script>
<script src="js/ow-messages.js"></script>
<script src="js/runner.js"></script>
<script src="js/main.js"></script>
</body>
</html>
