<style>
/* the shell around the console: the prototype bar and the page. Everything inside #aoc is the console's own stylesheet. */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#0f1114;font-family:"Barlow Semi Condensed",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bar{position:sticky;top:0;z-index:60;background:#111;color:#ddd;border-bottom:1px solid #333;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9a9a9a}
#bar .tag b{color:#fff;font-weight:600}
#bar .spacer{flex:1 1 auto;min-width:0}
#bar .seg{display:flex;border:1px solid #444;border-radius:3px;overflow:hidden;background:#1c1c1c}
#bar .seg button,#bar .seg a{font:inherit;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;min-height:32px;color:#cfcfcf;border:0;border-right:1px solid #444;background:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
#bar .seg button:last-child,#bar .seg a:last-child{border-right:0}
#bar .seg button[aria-pressed="true"]{background:#f2ece3;color:#111}
#page{display:block;transition:max-width .25s ease}
#page.tablet{max-width:1024px;margin-inline:auto;border-inline:1px solid #333;overflow:clip}
#aoc .aoc-desk{min-height:calc(100dvh - 48px)}
@media (max-width:640px){#bar .tag .long{display:none}}
</style>
<style>
/* ---- AOC: ThinkWork's white-label back end. Stylesheet. ----
   One layout, every site. Nothing in here reads a client's design tokens: the
   only things a site changes are the brand tokens AOC.mount() writes onto the
   host (--aoc-brand, --aoc-rail and the surfaces derived from the client's
   colours). Every class is prefixed aoc- so a site's own .card, .tile, .chip,
   .kv and .row never leak in, and AOC's never leak out.
   The two exceptions are [data-ph] and .phtag, which are the prototype
   toolbar's placeholder system: a site's placeholders.css styles them when the
   page has one, and the fallback rules at the foot of this file do the same
   job when AOC stands alone (the host carries data-ph-on). */

.aoc,.aoc *,.aoc *::before,.aoc *::after{box-sizing:border-box}
.aoc{
  --aoc-ui:"Barlow Semi Condensed",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --aoc-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* the defaults are AOC's own neutral light theme; mount() overwrites the brand
     and the rail from the client's colours, or from ThinkWork's on the switch */
  --aoc-bg:#F3F4F3;--aoc-surface:#FFFFFF;--aoc-surface-2:#ECEEEC;--aoc-sunk:#E7E9E7;
  --aoc-rail:#11151C;--aoc-rail-text:#E7E9EA;--aoc-rail-mute:#8A939D;--aoc-rail-hover:#1A222C;
  --aoc-line:#DEE1DE;--aoc-line-soft:#EBEDEB;--aoc-line-strong:#B9BEB9;
  --aoc-text:#11151C;--aoc-text-2:#4B5259;--aoc-text-3:#6B727A;
  --aoc-brand:#C0271F;--aoc-brand-2:#A31F18;--aoc-brand-ink:#B0231C;--aoc-brand-ghost:#FBE7E5;--aoc-on-brand:#FFFFFF;
  --aoc-go:#26734A;--aoc-go-ghost:#DFEFE5;--aoc-warn:#8A5806;--aoc-warn-ghost:#FBEEDA;
  --aoc-stop:#B02318;--aoc-stop-ghost:#FBE4E1;--aoc-info:#28557F;--aoc-info-ghost:#E2ECF6;
  --aoc-c1:#C0392B;--aoc-c2:#1268B8;--aoc-c3:#8E6A00;--aoc-c4:#6B4C9A;
  --aoc-shadow:0 1px 2px rgba(17,21,28,.06),0 8px 24px -18px rgba(17,21,28,.5);
  --aoc-ph:var(--ph,#B7771B);--aoc-on-ph:var(--on-ph,#141312);
  font-family:var(--aoc-ui);font-size:16px;line-height:1.45;color:var(--aoc-text);background:var(--aoc-bg);
  container-type:inline-size;container-name:aoc;text-align:left;-webkit-font-smoothing:antialiased;
  color-scheme:light}
.aoc[data-aoc-mode="dark"]{color-scheme:dark}
.aoc h1,.aoc h2,.aoc h3,.aoc h4{margin:0;font-family:var(--aoc-ui);font-weight:700;line-height:1.1;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;font-size:inherit}
.aoc h1{font-size:26px}
.aoc h2{font-size:20px}
.aoc h3{font-size:16px;letter-spacing:.03em}
.aoc h4{font-size:15px;letter-spacing:.02em}
.aoc p{margin:0}
.aoc a{color:inherit}
.aoc button,.aoc input,.aoc select,.aoc textarea{font:inherit;color:inherit;margin:0}
.aoc button{cursor:pointer;background:none;border:0;padding:0;text-transform:none;letter-spacing:0}
.aoc :where(button,input,select,textarea,a,[tabindex]):focus-visible{outline:2px solid var(--aoc-brand-ink);outline-offset:2px;border-radius:3px}
.aoc img,.aoc svg{max-width:100%}
.aoc [hidden]{display:none!important}
.aoc .aoc-mono{font-family:var(--aoc-mono);font-variant-numeric:tabular-nums}
.aoc .aoc-lbl{font-family:var(--aoc-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--aoc-text-3);font-weight:500}
.aoc .aoc-muted{color:var(--aoc-text-2)}
.aoc .aoc-small{font-size:14px}
.aoc .aoc-tiny{font-size:12.5px;color:var(--aoc-text-3)}
.aoc .aoc-sp{flex:1 1 auto;min-width:0}
.aoc .aoc-go-c{color:var(--aoc-go)}
.aoc .aoc-stop-c{color:var(--aoc-stop)}
.aoc .aoc-warn-c{color:var(--aoc-warn)}
.aoc .aoc-brand-c{color:var(--aoc-brand-ink)}

/* ---------- the desk shell: rail + main ---------- */
.aoc-desk{display:flex;min-height:80vh;align-items:stretch}
.aoc-rail{width:224px;flex:none;background:var(--aoc-rail);color:var(--aoc-rail-text);padding:14px 10px 18px;display:flex;flex-direction:column;gap:3px}
.aoc-brandrow{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;min-width:0}
.aoc-brandrow .aoc-logo{width:34px;height:34px;flex:none;background:var(--aoc-logo) center/contain no-repeat}
.aoc-brandrow b{font-size:14px;line-height:1.15;letter-spacing:.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis}
.aoc-brandrow b i{font-style:normal;color:var(--aoc-rail-mute);display:block;font-family:var(--aoc-mono);font-size:9.5px;letter-spacing:.16em;margin-top:3px}
.aoc-navsec{font-family:var(--aoc-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--aoc-rail-mute);padding:14px 9px 6px}
.aoc-rail a{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:5px;color:var(--aoc-rail-text);font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;min-height:38px}
.aoc-rail a:hover{background:var(--aoc-rail-hover);color:#fff}
.aoc-rail a.on{background:var(--aoc-brand);color:var(--aoc-on-brand)}
.aoc-rail a .aoc-tag{margin-left:auto;font-family:var(--aoc-mono);font-size:9px;letter-spacing:.08em;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.12);color:var(--aoc-rail-text)}
.aoc-rail a.on .aoc-tag{background:rgba(0,0,0,.25);color:var(--aoc-on-brand)}
.aoc-rail a.locked{opacity:.38;pointer-events:none}
.aoc-railfoot{margin-top:auto;padding:16px 9px 0;font-family:var(--aoc-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--aoc-rail-mute);line-height:1.6}
.aoc-main{flex:1;min-width:0;display:flex;flex-direction:column}
.aoc-topstrip{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--aoc-surface);border-bottom:1px solid var(--aoc-line);flex-wrap:wrap;position:relative;z-index:2}
.aoc-who{display:flex;align-items:center;gap:9px}
.aoc-avatar{width:32px;height:32px;border-radius:50%;background:var(--aoc-brand);color:var(--aoc-on-brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.aoc-vline{width:1px;height:30px;background:var(--aoc-line);flex:none}
.aoc-pad{padding:20px}
.aoc-screen.aoc-pad{padding-top:36px}
.aoc-screen{display:none}
.aoc-screen.on{display:block}
.aoc .aoc-screen>.phtag{top:8px!important;left:20px!important;max-width:calc(100% - 40px)}
.aoc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.aoc-head .aoc-lbl{margin-top:4px}

/* ---------- segmented switches ---------- */
.aoc-seg{display:flex;border:1px solid var(--aoc-line-strong);border-radius:4px;overflow:hidden;background:var(--aoc-surface)}
.aoc-seg button{font-family:var(--aoc-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:6px 10px;min-height:32px;color:var(--aoc-text-2);border-right:1px solid var(--aoc-line-strong);white-space:nowrap}
.aoc-seg button:last-child{border-right:0}
.aoc-seg button[aria-pressed="true"]{background:var(--aoc-brand);color:var(--aoc-on-brand)}

/* ---------- components ---------- */
.aoc-card{background:var(--aoc-surface);border:1px solid var(--aoc-line);border-radius:6px;min-width:0}
.aoc-card .aoc-hd{padding:12px 16px;border-bottom:1px solid var(--aoc-line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aoc-card .aoc-bd{padding:16px}
.aoc-card .aoc-bd+.aoc-bd{border-top:1px solid var(--aoc-line)}
.aoc-grid{display:grid;gap:14px;align-items:start}
.aoc-grid>*,.aoc-stack>*,.aoc-stack,.aoc-main,.aoc-screen{min-width:0}
.aoc-grid.two{grid-template-columns:1.3fr 1fr}
.aoc-grid.two-r{grid-template-columns:1fr 1.3fr}
.aoc-grid.half{grid-template-columns:1fr 1fr}
.aoc-grid.three{grid-template-columns:270px 1fr 340px}
.aoc-grid.side{grid-template-columns:340px 1fr}
.aoc-grid.auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.aoc-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aoc-stack{display:flex;flex-direction:column;gap:14px}
.aoc-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.aoc-tile{background:var(--aoc-surface);border:1px solid var(--aoc-line);border-radius:6px;padding:13px 15px;min-width:0}
.aoc-tile b{display:block;font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aoc-tile b small{font-family:var(--aoc-mono);font-size:13px;font-weight:500;color:var(--aoc-text-3);letter-spacing:.04em}
.aoc-tile .aoc-sub{display:block;font-size:12.5px;color:var(--aoc-text-3);margin-top:4px;line-height:1.3}
.aoc-tile.alert{border-color:var(--aoc-stop);background:var(--aoc-stop-ghost)}
.aoc-tile.alert b{color:var(--aoc-stop)}
.aoc-tile.good b{color:var(--aoc-go)}
.aoc-tile.key{border-top:3px solid var(--aoc-brand)}
.aoc-tile.key b{color:var(--aoc-brand-ink)}
.aoc-meter{height:6px;background:var(--aoc-surface-2);border-radius:99px;overflow:hidden;margin-top:9px}
.aoc-meter i{display:block;height:100%;background:var(--aoc-brand);border-radius:99px;transition:width .3s}
.aoc-meter.go i{background:var(--aoc-go)}
.aoc-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--aoc-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--aoc-line-strong);color:var(--aoc-text-2);white-space:nowrap;line-height:1.5;background:var(--aoc-surface)}
.aoc-chip.go{color:var(--aoc-go);border-color:var(--aoc-go);background:var(--aoc-go-ghost)}
.aoc-chip.warn{color:var(--aoc-warn);border-color:var(--aoc-warn);background:var(--aoc-warn-ghost)}
.aoc-chip.stop{color:var(--aoc-stop);border-color:var(--aoc-stop);background:var(--aoc-stop-ghost)}
.aoc-chip.info{color:var(--aoc-info);border-color:var(--aoc-info);background:var(--aoc-info-ghost)}
.aoc-chip.brand{color:var(--aoc-brand-ink);border-color:var(--aoc-brand-ink);background:var(--aoc-brand-ghost)}
.aoc-chip.ph{color:var(--aoc-on-ph);border-color:var(--aoc-ph);background:var(--aoc-ph)}
.aoc-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:9px 15px;min-height:40px;border-radius:5px;border:1px solid transparent;white-space:nowrap;line-height:1.2;cursor:pointer}
.aoc-btn:active{transform:translateY(1px)}
.aoc-btn.p{background:var(--aoc-brand);color:var(--aoc-on-brand);border-color:var(--aoc-brand)}
.aoc-btn.p:hover{background:var(--aoc-brand-2);border-color:var(--aoc-brand-2)}
.aoc-btn.g{border-color:var(--aoc-line-strong);color:var(--aoc-text);background:var(--aoc-surface)}
.aoc-btn.g:hover{background:var(--aoc-surface-2)}
.aoc-btn.sm{font-size:13px;padding:5px 10px;min-height:32px}
.aoc-btn.big{font-size:19px;padding:16px 24px;border-radius:7px}
.aoc-btn.wide{width:100%}
.aoc-btn[disabled]{opacity:.4;pointer-events:none}
.aoc table.aoc-t{width:100%;border-collapse:collapse;font-size:15px}
.aoc table.aoc-t th,.aoc table.aoc-t td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--aoc-line-soft);vertical-align:middle;font-family:inherit;font-weight:inherit;color:inherit;text-transform:none;letter-spacing:0}
.aoc table.aoc-t th{font-family:var(--aoc-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--aoc-text-3);font-weight:500;background:var(--aoc-surface-2)}
.aoc table.aoc-t tr:last-child td{border-bottom:0}
.aoc table.aoc-t tr.aoc-click{cursor:pointer}
.aoc table.aoc-t tr.aoc-click:hover td,.aoc table.aoc-t tr.on td{background:var(--aoc-surface-2)}
.aoc table.aoc-t td.num,.aoc table.aoc-t th.num{text-align:right;font-family:var(--aoc-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.aoc table.aoc-t td.aoc-mono{font-size:14px}
.aoc .aoc-tscroll{overflow-x:auto;border-radius:6px}
.aoc .aoc-kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--aoc-line)}
.aoc .aoc-kv:last-child{border-bottom:0}
.aoc .aoc-kv>span:first-child{color:var(--aoc-text-2);min-width:0}
.aoc .aoc-kv>b{font-family:var(--aoc-mono);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.aoc .aoc-kv>b.wrap{white-space:normal;text-align:right}
.aoc input.aoc-f,.aoc select.aoc-f,.aoc textarea.aoc-f{background:var(--aoc-surface);color:var(--aoc-text);border:1px solid var(--aoc-line-strong);border-radius:5px;padding:9px 11px;width:100%;min-height:40px;font-size:15px}
.aoc textarea.aoc-f{line-height:1.4;resize:vertical}
.aoc input.aoc-f::placeholder,.aoc textarea.aoc-f::placeholder{color:var(--aoc-text-3);opacity:1}
.aoc input.aoc-f.aoc-mono,.aoc select.aoc-f.aoc-mono{font-family:var(--aoc-mono)}
.aoc input.aoc-big{font-size:28px;font-family:var(--aoc-mono);text-transform:uppercase;letter-spacing:.09em;text-align:center;padding:12px;font-weight:600;min-height:56px}
.aoc .aoc-fld{margin-bottom:12px;min-width:0}
.aoc .aoc-fld .aoc-lbl{display:block;margin-bottom:5px}
.aoc .aoc-in{display:flex;align-items:center;gap:4px;font-family:var(--aoc-mono);font-size:15px;color:var(--aoc-text-3)}
.aoc .aoc-in input{width:100%;min-width:0}
.aoc .aoc-banner{display:flex;gap:11px;align-items:flex-start;background:var(--aoc-info-ghost);border:1px solid var(--aoc-info);border-radius:6px;padding:11px 14px;margin-bottom:16px;font-size:14.5px;color:var(--aoc-text)}
.aoc .aoc-banner b{color:var(--aoc-info);font-family:var(--aoc-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;flex:none;padding-top:3px}
.aoc .aoc-banner.why{background:var(--aoc-warn-ghost);border-color:var(--aoc-warn)}
.aoc .aoc-banner.why b{color:var(--aoc-warn)}
.aoc .aoc-feed{display:flex;flex-direction:column}
.aoc .aoc-feed div{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--aoc-line-soft);font-size:14.5px}
.aoc .aoc-feed div:last-child{border-bottom:0}
.aoc .aoc-feed time{font-family:var(--aoc-mono);font-size:12px;color:var(--aoc-text-3);flex:none;width:44px;padding-top:2px}
.aoc .aoc-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.aoc .aoc-person{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--aoc-line);border-radius:6px;background:var(--aoc-surface);text-align:left;width:100%;min-height:56px;cursor:pointer}
.aoc .aoc-person:hover{border-color:var(--aoc-brand-ink)}
.aoc .aoc-person.done{background:var(--aoc-go-ghost);border-color:var(--aoc-go)}
.aoc .aoc-person .aoc-nm{font-weight:600;font-size:15px;display:block}
.aoc .aoc-person .aoc-sub{font-size:12.5px;color:var(--aoc-text-2);display:block}
.aoc .aoc-bigok{display:grid;place-items:center;gap:12px;padding:34px 20px;text-align:center;background:var(--aoc-go-ghost);border:2px solid var(--aoc-go);border-radius:8px}
.aoc .aoc-bigok .aoc-tick{width:58px;height:58px;border-radius:50%;background:var(--aoc-go);display:grid;place-items:center}
.aoc .aoc-bigok .aoc-tick svg{width:30px;height:30px}
.aoc .aoc-sheetnote{display:none}
.aoc .aoc-sheet{background:#fff;color:#11151C;border:1px solid #CBD0CB;border-radius:6px;padding:20px;font-family:var(--aoc-ui)}
.aoc .aoc-sheet table.aoc-t{width:100%;border-collapse:collapse;font-size:13px}
.aoc .aoc-sheet table.aoc-t th,.aoc .aoc-sheet table.aoc-t td{border:1px solid #CBD0CB;padding:5px 7px;text-align:left;color:#11151C;font-family:inherit;text-transform:none;letter-spacing:0;font-weight:inherit;background:#fff}
.aoc .aoc-sheet table.aoc-t th{background:#EFF1EF;font-family:var(--aoc-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.aoc .aoc-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:6px}
.aoc .aoc-checks label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--aoc-line);border-radius:5px;background:var(--aoc-surface);min-height:44px;cursor:pointer;font-family:var(--aoc-mono);font-size:12.5px}
.aoc .aoc-checks label input{accent-color:var(--aoc-brand);width:18px;height:18px;flex:none;margin:0}
.aoc .aoc-checks label.on{border-color:var(--aoc-go);background:var(--aoc-go-ghost)}
.aoc .aoc-checks label small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--aoc-text-3)}
.aoc .aoc-bar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:8px 0 6px;border:1px solid var(--aoc-line-strong)}
.aoc .aoc-bar i{display:block;height:100%}
.aoc .aoc-bar i.card{background:var(--aoc-brand)}
.aoc .aoc-bar i.cash{background:var(--aoc-line-strong)}
.aoc .aoc-toast{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);z-index:90;background:#11151C;color:#F1F1EE;font-family:var(--aoc-mono);font-size:12.5px;padding:10px 16px;border-radius:5px;border-left:4px solid var(--aoc-brand);box-shadow:var(--aoc-shadow);max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.aoc .aoc-toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
.aoc .aoc-bracket{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.aoc .aoc-bracket div{display:grid;grid-template-columns:24px 1fr auto 1fr;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--aoc-line);border-radius:5px;background:var(--aoc-surface-2);font-size:13.5px}
.aoc .aoc-bracket div i{font-family:var(--aoc-mono);font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--aoc-text-3)}
.aoc .aoc-bracket div em{font-style:normal;font-weight:700;color:var(--aoc-brand-ink)}
.aoc .aoc-fares{display:grid;gap:6px}
.aoc .aoc-fhead,.aoc .aoc-frow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.aoc .aoc-fhead{padding-inline:4px}
.aoc .aoc-frow{padding:8px 10px;border:1px solid var(--aoc-line);border-radius:5px;background:var(--aoc-surface-2)}
.aoc .aoc-frow b{font-size:16px;font-weight:700;text-transform:uppercase;line-height:1.1;display:block}
.aoc .aoc-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.aoc .aoc-form.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.aoc .aoc-form input.aoc-f{font-family:var(--aoc-mono);font-variant-numeric:tabular-nums}
.aoc .aoc-switch{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--aoc-line);border-radius:7px;background:var(--aoc-surface);margin-bottom:10px}
.aoc .aoc-switch .aoc-sw{width:42px;height:24px;border-radius:99px;background:var(--aoc-line-strong);position:relative;flex:none;margin-top:2px}
.aoc .aoc-switch .aoc-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s}
.aoc .aoc-switch.on .aoc-sw{background:var(--aoc-go)}
.aoc .aoc-switch.on .aoc-sw::after{left:21px}
.aoc .aoc-matrix td.y{color:var(--aoc-go);font-weight:700;text-align:center}
.aoc .aoc-matrix td.n{color:var(--aoc-text-3);text-align:center}
.aoc .aoc-verdict{border-radius:8px;padding:14px 16px;border:2px solid var(--aoc-line)}
.aoc .aoc-verdict.go{border-color:var(--aoc-go);background:var(--aoc-go-ghost)}
.aoc .aoc-verdict.warn{border-color:var(--aoc-warn);background:var(--aoc-warn-ghost)}
.aoc .aoc-verdict.stop{border-color:var(--aoc-stop);background:var(--aoc-stop-ghost)}
.aoc .aoc-verdict h4{font-size:17px;margin-bottom:4px}
.aoc .aoc-verdict.go h4{color:var(--aoc-go)}
.aoc .aoc-verdict.warn h4{color:var(--aoc-warn)}
.aoc .aoc-verdict.stop h4{color:var(--aoc-stop)}
.aoc .aoc-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px}
.aoc .aoc-legend span{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--aoc-text-2)}
.aoc .aoc-legend i{width:11px;height:11px;border-radius:3px;flex:none}
.aoc .aoc-chart svg{width:100%;height:auto;display:block;overflow:visible}
.aoc .aoc-chart text{font-family:var(--aoc-mono)}
.aoc .aoc-tip{display:none;position:fixed;z-index:400;background:var(--aoc-text);color:var(--aoc-bg);font-size:13px;padding:6px 9px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .12s;font-family:var(--aoc-mono);white-space:nowrap}
.aoc .aoc-tip.on{display:block;opacity:1}

/* ---------- run of day, game control, the big screen ---------- */
.aoc .aoc-rod{display:flex;flex-direction:column}
.aoc .aoc-rod .aoc-step{display:flex;gap:12px;align-items:flex-start;padding:9px 0;position:relative;cursor:pointer}
.aoc .aoc-rod .aoc-step::before{content:"";position:absolute;left:7px;top:26px;bottom:-9px;width:2px;background:var(--aoc-line)}
.aoc .aoc-rod .aoc-step:last-child::before{display:none}
.aoc .aoc-rod .aoc-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--aoc-line-strong);background:var(--aoc-surface);flex:none;margin-top:4px;z-index:1}
.aoc .aoc-rod .aoc-step.done .aoc-dot{background:var(--aoc-go);border-color:var(--aoc-go)}
.aoc .aoc-rod .aoc-step.now .aoc-dot{background:var(--aoc-brand);border-color:var(--aoc-brand);box-shadow:0 0 0 4px var(--aoc-brand-ghost)}
.aoc .aoc-rod .aoc-step.now b{color:var(--aoc-brand-ink)}
.aoc .aoc-rod time{font-family:var(--aoc-mono);font-size:13px;color:var(--aoc-text-3);width:44px;flex:none;margin-top:5px}
.aoc .aoc-teams{display:flex;gap:10px}
.aoc .aoc-teams button{flex:1;padding:14px;min-height:56px;border-radius:7px;border:2px solid var(--aoc-line-strong);font-weight:700;font-size:18px;text-transform:uppercase;background:var(--aoc-surface)}
.aoc .aoc-teams button.red{color:#B02318}
.aoc .aoc-teams button.blue{color:#1160A8}
.aoc .aoc-teams button.red:hover,.aoc .aoc-teams button.red[aria-pressed="true"]{background:#C0392B;color:#fff;border-color:#C0392B}
.aoc .aoc-teams button.blue:hover,.aoc .aoc-teams button.blue[aria-pressed="true"]{background:#1268B8;color:#fff;border-color:#1268B8}
.aoc .aoc-preview{background:#07090C;border:1px solid #222;border-radius:8px;padding:18px;color:#F2F2EF;min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:8px}
.aoc .aoc-preview .aoc-lbl{color:#8A939D}
.aoc .aoc-preview .aoc-mode{font-size:clamp(20px,3cqi,30px);line-height:1.1;color:#fff;font-weight:700;text-transform:uppercase}
.aoc .aoc-preview .aoc-cd{font-family:var(--aoc-mono);font-size:34px;font-weight:600;color:#FF6B61}
.aoc-bigscreen{position:fixed;inset:0;height:100dvh;width:100vw;z-index:300;background:#07090C;color:#F2F2EF;display:none;flex-direction:column;padding:clamp(20px,4vw,56px);overflow:hidden;font-family:var(--aoc-ui)}
.aoc-bigscreen.on{display:flex}
.aoc-bigscreen .aoc-top{display:flex;align-items:center;gap:16px;flex:none}
.aoc-bigscreen .aoc-top .aoc-logo{width:44px;height:44px;background:var(--aoc-logo) center/contain no-repeat}
.aoc-bigscreen .aoc-top .aoc-nm{font-size:20px;line-height:1.1;font-weight:700;text-transform:uppercase}
.aoc-bigscreen .aoc-clock{margin-left:auto;font-family:var(--aoc-mono);font-size:clamp(20px,2.6vw,32px);color:#8A939D}
.aoc-bigscreen .aoc-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,2vh,22px);min-height:0}
.aoc-bigscreen .aoc-kicker{font-family:var(--aoc-mono);font-size:clamp(12px,1.5vw,18px);letter-spacing:.3em;text-transform:uppercase;color:#8A939D}
.aoc-bigscreen .aoc-huge{font-size:clamp(34px,8.5vw,120px);line-height:.98;color:#fff;text-transform:uppercase;max-width:16ch;font-weight:700}
.aoc-bigscreen .aoc-count{font-family:var(--aoc-mono);font-size:clamp(44px,11vw,150px);font-weight:600;line-height:1;color:#FF6B61;font-variant-numeric:tabular-nums}
.aoc-bigscreen .aoc-sub{font-size:clamp(15px,2vw,26px);color:#B9C0C8;max-width:30ch}
.aoc-bigscreen .aoc-board{width:min(760px,100%);text-align:left}
.aoc-bigscreen .aoc-board .aoc-lead{display:flex;align-items:center;gap:16px;padding:clamp(6px,1.4vh,14px) 0;border-bottom:1px solid #1B212A}
.aoc-bigscreen .aoc-board .aoc-pos{font-family:var(--aoc-mono);font-size:clamp(16px,2vw,26px);color:#6E7681;width:42px}
.aoc-bigscreen .aoc-board .aoc-nm2{font-size:clamp(17px,2.2vw,30px);font-weight:600;flex:1}
.aoc-bigscreen .aoc-board .aoc-pts{font-family:var(--aoc-mono);font-size:clamp(18px,2.4vw,32px);color:#FF6B61}
.aoc-bigscreen .aoc-winner{display:inline-flex;align-items:center;gap:14px;padding:clamp(10px,2vh,20px) clamp(20px,4vw,44px);border-radius:10px;font-size:clamp(26px,6vw,74px);color:#fff;font-weight:700;text-transform:uppercase}
.aoc-bigscreen .aoc-winner.red{background:#C0392B}
.aoc-bigscreen .aoc-winner.blue{background:#1268B8}
.aoc-bigscreen .aoc-exit{position:absolute;top:14px;right:14px;z-index:5;background:#161C24;color:#C6CBD1;border:1px solid #2A323D;border-radius:6px;padding:7px 12px;font-family:var(--aoc-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.aoc-bigscreen canvas{width:min(46vh,340px);height:min(46vh,340px);max-width:100%}

/* ---------- modal (the plan editor) ---------- */
.aoc-modal{position:fixed;inset:0;z-index:250;background:rgba(9,13,18,.62);display:none;align-items:center;justify-content:center;padding:20px;font-family:var(--aoc-ui)}
.aoc-modal.on{display:flex}
.aoc-modal .aoc-box{background:var(--aoc-bg);color:var(--aoc-text);border:1px solid var(--aoc-line);border-radius:10px;box-shadow:var(--aoc-shadow);width:min(1040px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.aoc-modal .aoc-box>header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--aoc-line);background:var(--aoc-surface);flex-wrap:wrap}
.aoc-modal .aoc-body{display:grid;grid-template-columns:246px 1fr;min-height:0;flex:1;overflow:hidden}
.aoc-modal .aoc-list{border-right:1px solid var(--aoc-line);overflow-y:auto;background:var(--aoc-surface-2);padding:10px}
.aoc-modal .aoc-list button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px;margin-bottom:5px;border:1px solid transparent}
.aoc-modal .aoc-list button:hover{background:var(--aoc-surface)}
.aoc-modal .aoc-list button.on{background:var(--aoc-surface);border-color:var(--aoc-brand-ink)}
.aoc-modal .aoc-list b{display:block;font-size:15px}
.aoc-modal .aoc-list span{font-size:12.5px;color:var(--aoc-text-2)}
.aoc-modal .aoc-edit{overflow-y:auto;padding:18px;display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}

/* ---------- the proposal: a document, not an app ---------- */
.aoc-prop{padding:clamp(40px,4cqi,56px) 20px clamp(48px,6cqi,88px)}
.aoc-prop .aoc-wrap{width:min(1180px,100%);margin-inline:auto}
.aoc-prop .aoc-eyebrow{font-family:var(--aoc-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--aoc-text-3);font-weight:500}
.aoc-prop h2{font-size:clamp(26px,3cqi,40px);line-height:1.02;margin:10px 0 10px}
.aoc-prop h3{font-size:clamp(20px,2cqi,28px);line-height:1.05;letter-spacing:.01em;margin:8px 0 12px}
.aoc-prop .aoc-lede{font-size:clamp(17px,1.4cqi,20px);color:var(--aoc-text-2);max-width:66ch;margin-bottom:26px}
.aoc-prop .aoc-card{margin-bottom:16px}
.aoc-prop .aoc-card .aoc-bd{padding:clamp(16px,2cqi,26px)}
.aoc-prop .aoc-card.aoc-hi{background:var(--aoc-sunk)}
.aoc-prop .aoc-split{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,3cqi,44px);align-items:start}
.aoc-prop .aoc-quote{margin:14px 0;padding:12px 16px;border-left:3px solid var(--aoc-brand);font-size:18px;font-weight:600;line-height:1.35}
.aoc-prop .aoc-check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.aoc-prop .aoc-check li{position:relative;padding-left:22px;font-size:14.5px;color:var(--aoc-text-2);line-height:1.4}
.aoc-prop .aoc-check li::before{content:"";position:absolute;left:4px;top:4px;width:6px;height:12px;border:solid var(--aoc-go);border-width:0 2px 2px 0;transform:rotate(45deg)}
.aoc-prop .aoc-check.x li::before,.aoc-prop .aoc-check.x li::after{content:"";position:absolute;left:1px;top:10px;width:13px;height:2px;border:0;background:var(--aoc-ph);transform:rotate(45deg)}
.aoc-prop .aoc-check.x li::after{transform:rotate(-45deg)}
.aoc-prop .aoc-check.grey li::before,.aoc-prop .aoc-check.grey li::after{background:var(--aoc-text-3)}
.aoc-prop .aoc-slider{width:100%;accent-color:var(--aoc-brand);min-height:36px;margin:0}
.aoc-prop .aoc-sl label{display:block;margin-bottom:2px}
.aoc-prop .aoc-bigfig{font-size:clamp(34px,4cqi,56px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin-top:10px}
.aoc-prop .aoc-bigfig small{font-size:.38em;font-weight:600;color:var(--aoc-text-3);letter-spacing:.02em}
.aoc-prop .aoc-code{background:var(--aoc-sunk);border:1px solid var(--aoc-line);border-radius:6px;overflow-x:auto;padding:14px 16px}
.aoc-prop .aoc-code pre{margin:0;font-family:var(--aoc-mono);font-size:12px;line-height:1.6;color:var(--aoc-text-2);white-space:pre}
.aoc-prop .aoc-code .t{color:var(--aoc-brand-ink)}
.aoc-prop .aoc-radio{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--aoc-line);border-radius:6px;background:var(--aoc-surface);cursor:pointer;flex:1 1 200px;min-height:44px}
.aoc-prop .aoc-radio.sel{border-color:var(--aoc-brand-ink);background:var(--aoc-brand-ghost)}
.aoc-prop .aoc-radio input{margin-top:5px;accent-color:var(--aoc-brand);width:18px;height:18px;flex:none}
.aoc-prop .aoc-note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border:1px dashed var(--aoc-brand-ink);background:var(--aoc-brand-ghost);border-radius:6px;font-size:13.5px;line-height:1.45}
.aoc-prop .aoc-note b{font-family:var(--aoc-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--aoc-brand-ink);flex:none;padding-top:3px}
.aoc-prop .aoc-ph{border-bottom:1.5px dashed var(--aoc-ph);padding-bottom:1px}
.aoc-prop .aoc-foot{font-size:13px;color:var(--aoc-text-3);margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--aoc-line);padding-top:14px}

/* ---------- placeholders: the toolbar's system, with a fallback for a standalone mount ---------- */
.aoc [data-ph]{position:relative}
.aoc .phtag{display:none;position:absolute;top:-13px;left:8px;z-index:6;align-items:center;gap:5px;background:var(--aoc-ph);color:var(--aoc-on-ph);font-family:var(--aoc-mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:2px 8px;border-radius:2px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
body.ph-on .aoc [data-ph]>.phtag,.aoc[data-ph-on] [data-ph]>.phtag{display:inline-flex}
.aoc[data-ph-on] [data-ph]{outline:1.5px dashed var(--aoc-ph);outline-offset:7px;border-radius:2px}
body.ph-on .aoc .aoc-screen[data-ph],.aoc[data-ph-on] .aoc-screen[data-ph]{outline-offset:-6px}

/* ---------- narrow: a tablet held sideways, a phone, or the toolbar's Mobile toggle ---------- */
@container aoc (max-width:960px){
  .aoc-grid.two,.aoc-grid.two-r,.aoc-grid.half,.aoc-grid.three,.aoc-grid.side{grid-template-columns:1fr}
  .aoc-modal .aoc-edit{grid-template-columns:1fr}
  .aoc-prop .aoc-split{grid-template-columns:1fr}
}
@container aoc (max-width:900px){
  .aoc-desk{flex-direction:column}
  .aoc-rail{width:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:8px}
  .aoc-brandrow,.aoc-navsec,.aoc-railfoot{display:none}
  .aoc-rail a{white-space:nowrap;font-size:14px;flex:0 1 auto;min-height:36px;padding:6px 9px}
  .aoc-rail a .aoc-tag{display:none}
  .aoc-pad{padding:14px}
  .aoc-topstrip{padding:10px 14px;gap:10px}
  .aoc-modal .aoc-body{grid-template-columns:1fr}
  .aoc-modal .aoc-list{max-height:160px;border-right:0;border-bottom:1px solid var(--aoc-line)}
}
@container aoc (max-width:640px){
  /* tables stack into labelled rows instead of scrolling sideways: nothing is ever past the edge of a phone */
  .aoc table.aoc-t thead{display:none}
  .aoc table.aoc-t,.aoc table.aoc-t tbody{display:block;width:100%}
  .aoc table.aoc-t tr{display:block;padding:8px 0;border-bottom:1px solid var(--aoc-line)}
  .aoc table.aoc-t tr:last-child{border-bottom:0}
  .aoc table.aoc-t td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;border:0;text-align:right;min-width:0;background:none!important}
  .aoc table.aoc-t td::before{content:attr(data-l);font-family:var(--aoc-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--aoc-text-3);flex:none;text-align:left}
  .aoc table.aoc-t td[colspan]::before{display:none}
  .aoc table.aoc-t td:first-child{font-weight:600}
  .aoc table.aoc-t td>.aoc-meter{width:100%;max-width:140px}
  .aoc table.aoc-t td.num{text-align:right}
  .aoc .aoc-sheet table.aoc-t td{border:0;padding:3px 0}
  .aoc .aoc-sheet table.aoc-t tr{border-bottom:1px solid #CBD0CB}
  .aoc-prop .aoc-code pre{white-space:pre-wrap;word-break:break-word}
  .aoc-prop .aoc-split>*{min-width:0}
  .aoc .aoc-kv>b{white-space:normal}
  .aoc .aoc-kv:has(>b.wrap){flex-direction:column;align-items:flex-start;gap:4px}
  .aoc .aoc-kv>b.wrap{text-align:left}
  .aoc .aoc-sheet{display:none}
  .aoc .aoc-sheetnote{display:block}
  .aoc .aoc-hd .aoc-chip{white-space:normal}
  .aoc-topstrip .aoc-chip{white-space:normal}
  .aoc-tiles{grid-template-columns:1fr 1fr}
  .aoc-tile b{font-size:24px}
  .aoc .aoc-form,.aoc .aoc-form.four,.aoc .aoc-bracket{grid-template-columns:1fr}
  .aoc .aoc-fhead,.aoc .aoc-frow{gap:6px}
  .aoc-topstrip .aoc-vline,.aoc-topstrip .aoc-next{display:none}
  .aoc h1{font-size:22px}
  .aoc-prop{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){.aoc *{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media print{.aoc-rail,.aoc-topstrip,.aoc-screen:not(.on){display:none!important}}

</style>

<body>
<div id="bar">
  <span class="tag"><b>NSC Airsoft</b> &nbsp;/&nbsp; AOC, your operator console &nbsp;/&nbsp; <span class="long">sample data, nothing is stored</span></span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Device"><button id="devDesk" aria-pressed="true">Desktop</button><button id="devTab" aria-pressed="false">Tablet</button></div>
  <div class="seg" role="group" aria-label="Options"><button id="phBtn" aria-pressed="true">Placeholders</button></div>
  <div class="seg"><a id="siteLink" href="../index.html">Back to the site</a></div>
</div>
<div id="page"><div id="aoc"></div></div>
<script>
/* ---- AOC: the Airsoft Operator Console. ThinkWork's white-label back end. ----
   One product, built and versioned once (aoc/VERSION), plugged into every
   ThinkWork prototype. A site supplies four things and nothing else: its logo,
   its colours, its name and its data. The panels, their order and their layout
   are the same on every site.

   Contract:
     AOC.mount(el, {
       brand:  { name, short, logo, colours:{ accent, ground } },
       theme:  { colours:"client"|"thinkwork", mode:"light"|"dark" },   optional
       screen: "today" | ... | "proposal",                              optional

/* ---------- the running days: the same rule the site's calendar is built from ---------- */
function buildDates(cal,events){
  const REG=Object.assign({day:0,dayName:"Sunday",label:"Game day",count:12},cal.regular||{});
  const spaces=(cal.spaces&&cal.spaces.length)?cal.spaces:[14,22,7,31,19,3,26,11,38,16,9,24];
  const BREAK=[cal.breakFrom||"12-25",cal.breakTo||"12-25"].map(x=>String(x).split("-").map(Number));
  const isBreak=d=>{const m=d.getMonth()+1,day=d.getDate();return (m===BREAK[0][0]&&day>=BREAK[0][1])||(m===BREAK[1][0]&&day<=BREAK[1][1]);};

    const ev={key:e.key,name:e.name,short:e.short||e.name,detail:e.detail||"",times:e.times,price:e.price,deposit:e.deposit,prize:!!e.prize,off:e.off,offLabel:e.offLabel,prizes:e.prizes,sample:!!e.sample,real:true};
    const same=out.find(x=>x.dt.toDateString()===dt.toDateString());
    if(same)Object.assign(same,ev,{left:e.left!=null?e.left:same.left,cap:e.cap||same.cap,regular:false});
    else out.push(Object.assign({dt,kind:e.dayName||dt.toLocaleDateString("en-GB",{weekday:"long"}),left:e.left!=null?e.left:12,cap:e.cap||40,tba:false,sess:"full",regular:false},ev));
  }
  const X=cal.extra;
  if(X&&X.dayName){
    const now=new Date();
    const regs=out.filter(x=>x.regular); const lastReg=regs.length?regs.reduce((a,b)=>a.dt>b.dt?a:b):null;
    if(X.weekly){
      const e=new Date();e.setHours(8,0,0,0);let a=(7+X.day-e.getDay())%7;if(a===0&&Date.now()>e.getTime()+8*3600e3)a=7;e.setDate(e.getDate()+a);
      let j=0;while(lastReg&&e<=lastReg.dt&&j<40){if(!isBreak(e))out.push({dt:new Date(e),kind:X.dayName,name:X.label,detail:X.detail||"",left:spaces[(j+5)%spaces.length],cap:X.cap||cal.cap||40,tba:false,sess:X.sess||"half",regular:false,extra:true});e.setDate(e.getDate()+7);j++;}
    }else if(lastReg){
      const horizon=lastReg.dt.getFullYear()*12+lastReg.dt.getMonth();
      for(let k=0;k<12;k++){
        const m=new Date(now.getFullYear(),now.getMonth()+k,1);
        if(X.fromMonth!=null&&(m.getMonth()<X.fromMonth||m.getMonth()>X.toMonth))continue;

}

/* ---------- the roster for the next running day, priced off the real tickets ---------- */
function ticketFor(d,kind,sess){return d.tickets.find(t=>t.kind===kind&&t.sess===sess)||d.tickets.find(t=>t.kind===kind)||d.tickets[0];}
function buildRoster(d,r){
  const R=d.roster, players=[]; let ni=0;
  for(const row of R.mix||[]){const [kind,sess,member,n]=row;for(let i=0;i<n;i++){const t=ticketFor(d,kind,sess);const name=R.names[ni%R.names.length]+(ni>=R.names.length?" "+(Math.floor(ni/R.names.length)+1):"");ni++;
    players.push({id:players.length,name,init:initials(name),kind,sess,member:!!member,ticket:t,price:member?t.member:t.price,waiver:true,u18:false,arrived:false,in:false,reg:null,chrono:null,flagged:false,pts:0,kit:kind==="hire",kitOut:false,pre:[]});}}
  (R.noWaiver||[]).forEach(i=>{if(players[i])players[i].waiver=false;});
  (R.under18||[]).forEach(i=>{if(players[i])players[i].u18=true;});
  /* pre-orders land on named players, spread through the list */
  d.preorders.forEach((p,k)=>{for(let i=0;i<p.n;i++){const pl=players[(i*3+k*5)%Math.max(1,players.length)];if(pl&&!pl.pre.includes(p.key))pl.pre.push(p.key);}});
  players.forEach((p,i)=>{p.pts=[9,7,7,6,5,4,4,3,3,2][i]||Math.floor(r()*3);});
  return players;
}

/* ---------- bookings: the site's own sample rows, or one per player ---------- */
function buildBookings(d,dates,players){
  const nonTba=dates.filter(x=>!x.tba);
  const dateAt=w=>w==="next"||w==null?nonTba[0]:(typeof w==="number"?nonTba[Math.min(w,nonTba.length-1)]:nonTba[0]);
  const out=[];
  if(d.bookings.length){
    for(const row of d.bookings){
      const [ref,name,when,walkon,hire,sess,member,status,extras,flag]=row;
      const dt=dateAt(when);if(!dt)continue;
      const items=[];if(walkon)items.push({kind:"walkon",n:walkon});if(hire)items.push({kind:"hire",n:hire});
      let paid=0;const ev=dt.deposit?dt:null;
      for(const it of items){const t=ticketFor(d,it.kind,sess||"full");const unit=ev?(it.kind==="walkon"?ev.deposit:0):(member?t.member:t.price);paid+=unit*it.n*(dt.off?dt.off:1);}

    }
  }else{
    players.forEach((p,i)=>{const dt=nonTba[0];out.push({ref:d.ref+"-"+(1000+i*37).toString(36).toUpperCase().slice(0,4),name:p.name,date:dt,items:[{kind:p.kind,n:1}],sess:p.sess,member:p.member,status:p.waiver?"paid":"waiver",extras:0,paid:p.price,flag:false,due:0});});
  }

}

/* ---------- stock: the site's products with sample counts on the shelf ---------- */
function buildStock(d,r){

/* ---------- history: the past eight running days, all sample ---------- */
function buildHistory(d,players,r){
  const REG=d.calendar.regular, step=REG.every||7, out=[];
  const base=new Date();base.setHours(8,0,0,0);let back=(base.getDay()-REG.day+7)%7;if(back===0)back=7;base.setDate(base.getDate()-back);
  const W=ticketFor(d,"walkon","full"),H=ticketFor(d,"hire","full");
  const avg=(W.price+W.member)/2*0.72+(H.price+H.member)/2*0.28;
  const typical=d.money.lastYearPlayers||players.length||38;
  for(let i=0;i<8;i++){const dt=new Date(base);dt.setDate(base.getDate()-i*step);const booked=Math.max(8,Math.round(typical*(0.75+r()*0.5)));const up=booked-Math.floor(r()*4);const chrono=Math.max(0,up-Math.floor(r()*3));out.push({dt,name:REG.label,booked,up,chrono,took:Math.round(up*avg+Math.floor(r()*120)),flagged:i===2?1:0,pod:players[(i*7)%players.length].name});}
  return out;
}

const card=(hd,bd,extra)=>'<div class="aoc-card'+(extra?" "+extra:"")+'">'+(hd?'<div class="aoc-hd">'+hd+'</div>':'')+bd+'</div>';
const head=(h1,lbl,actions)=>'<div class="aoc-head"><div><h1>'+h1+'</h1>'+(lbl?'<p class="aoc-lbl">'+lbl+'</p>':'')+'</div>'+(actions?'<div class="aoc-row">'+actions+'</div>':'')+'</div>';

const tbl=(cols,rows,attrs)=>'<div class="aoc-tscroll"><table class="aoc-t"'+(attrs||"")+'><thead><tr>'+cols.map(c=>'<th'+(/^num:/.test(c)?' class="num"':'')+'>'+c.replace(/^num:/,"")+'</th>').join("")+'</tr></thead><tbody>'+labelCells(rows,cols)+'</tbody></table></div>';

function paintToday(inst){
  const d=inst.data,m=inst.m,P=m.players,n=P.length;
  const arrived=P.filter(p=>p.arrived).length, inn=P.filter(p=>p.in).length, ch=P.filter(p=>p.chrono).length, noWv=P.filter(p=>!p.waiver).length;
  const online=P.reduce((a,p)=>a+p.price,0)+m.preTotal;
  q('[data-aoc="evName"]',inst.el).textContent=fmtShort(m.next.dt)+" · "+m.next.name;
  const tiles=q('[data-aoc="todayTiles"]',inst.el); if(!tiles)return;
  tiles.innerHTML=tile("Booked on",n,"",P.filter(p=>p.kind==="walkon").length+" "+d.labels.walkon.toLowerCase()+", "+P.filter(p=>p.kind==="hire").length+" "+d.labels.hire.toLowerCase())+
    tile("Arrived",arrived+'<div class="aoc-meter"><i style="width:'+(arrived/n*100)+'%"></i></div>')+
    tile("Checked in",inn+'<div class="aoc-meter go"><i style="width:'+(inn/n*100)+'%"></i></div>',"good")+
    tile("Chrono'd",ch,ch<inn?"alert":"good",ch<inn?(inn-ch)+" in and not yet over the chrono":"everyone in has been over the chrono")+
    tile("Forms outstanding",noWv,noWv?"alert":"good",noWv?"sign on the tablet at the gate":"everyone signed")+
    tile("Taken online",gbp(online),"key","paid by card before the gates open");
  const attn=[];
  P.filter(p=>!p.waiver).forEach(p=>attn.push([p.name,"Safety form not signed","stop"]));
  P.filter(p=>p.in&&!p.chrono).forEach(p=>attn.push([p.name,"Checked in, not chrono'd","warn"]));
  P.filter(p=>p.flagged).forEach(p=>attn.push([p.name,"Spot check over the limit","stop"]));
  P.filter(p=>p.u18&&!p.in).slice(0,3).forEach(p=>attn.push([p.name,"Under 18: full face, guardian signs","info"]));
  const ac=q('[data-aoc="attn"]',inst.el); ac.previousElementSibling.querySelector(".aoc-chip").textContent=attn.length;
  ac.innerHTML=attn.length?attn.slice(0,8).map(a=>'<div class="aoc-kv"><span><b>'+esc(a[0])+'</b></span>'+chip(a[1],a[2])+'</div>').join(""):'<p class="aoc-go-c"><b>Nothing outstanding.</b> Everyone signed, checked in and chrono\'d.</p>';
  q('[data-aoc="feed"]',inst.el).innerHTML=m.feed.map(f=>'<div><time>'+esc(f.t)+'</time><span>'+esc(f.msg)+'</span></div>').join("");
  const kits=P.filter(p=>p.kit), kitsOut=kits.filter(p=>p.kitOut).length, preN=d.preorders.reduce((a,p)=>a+p.n,0);
  q('[data-aoc="before"]',inst.el).innerHTML=
    kv(d.labels.hire+" kits to issue, booked and paid",'<span>'+kitsOut+' of '+kits.length+' out</span>')+
    kv("Pre-orders to bag, paid already",preN+" items, "+gbp(m.preTotal))+
    kv("Safety forms still to sign",noWv+" of "+n)+
    kv("Joined as members at the checkout this week",d.money.joinedToday)+
    '<div class="aoc-row" style="margin-top:12px"><button class="aoc-btn g sm" data-aoc-go="reception">Issue kit</button><button class="aoc-btn g sm" data-aoc-go="shop">Picking list</button><button class="aoc-btn g sm" data-aoc-act="remind">Send a form reminder</button></div>'+
    '<p class="aoc-tiny" style="margin-top:10px">You knew all of this on Friday. Nothing here was counted at the gate.</p>';
  const ly=d.money.lastYear||0, lyP=d.money.lastYearPlayers||0;
  q('[data-aoc="vs"]',inst.el).innerHTML=
    '<div class="aoc-grid half">'+
      '<div><span class="aoc-lbl">Paid ahead, this '+esc(m.next.kind)+'</span><b style="display:block;font-size:30px;font-weight:700;line-height:1.1;margin-top:4px">'+gbp(online)+'</b><span class="aoc-tiny">'+n+' players, by card, before anyone has parked</span></div>'+
      '<div><span class="aoc-lbl">Same '+esc(m.next.kind)+' last year</span><b style="display:block;font-size:30px;font-weight:700;line-height:1.1;margin-top:4px;color:var(--aoc-text-3)">'+(ly?gbp(ly):"not counted")+'</b><span class="aoc-tiny">'+(ly?(lyP?lyP+" players, ":"")+"counted in "+esc(d.settings.todayTake)+" at the gate":"no record to compare against")+'</span></div>'+
    '</div>'+
    (ly?'<div class="aoc-meter" style="margin-top:14px"><i style="width:'+Math.min(100,Math.round(online/ly*100))+'%"></i></div>':"")+
    '<p class="aoc-tiny" style="margin-top:8px">Both figures are sample. Yours replace them the first '+esc(m.next.kind)+' it runs.</p>';
}

  const det=q('[data-aoc="bkDetail"]',inst.el), b=m.bookings.find(x=>x.ref===inst.sel.booking);
  if(!b){det.innerHTML="";return;}
  const nextOther=m.dates.find(x=>!x.tba&&x!==b.date);

function dateStatus(x,i){return x.tba?chip("Date TBA","warn"):i===0?chip("Next","go"):x.sample?chip("Sample event","ph"):chip("On sale","info");}

  const d=inst.data,m=inst.m,W=ticketFor(d,"walkon","full");

function cePreview(inst){

/* ---------- the plan editor (a modal): is a plan worth buying, and what is it worth to you ---------- */
function planWorth(p,sessions,TICKET){
  if(p.kind==="free")return {pays:0,gets:0};
  if(p.kind==="block")return {pays:p.price,gets:(p.days||0)*TICKET};
  const pays=p.per==="year"?p.price/12:p.price;
  const gets=p.unlim?sessions*TICKET:sessions*((+p.disc||0)+(+p.bbs||0))+(+p.guests||0)*10;
  return {pays,gets};
}

  const d=inst.data,p=draftPlan(inst),T=ticketFor(d,"walkon","full").price,S=inst.m.sessionsPerMonth,g=k=>q('[data-aoc="'+k+'"]',inst.el);
  const rows=[1,2,3,4].filter(n=>n<=Math.max(S,2)).map(n=>{const w=planWorth(p,n,T);return {n,pays:w.pays,gets:w.gets,net:w.gets-w.pays};});
  g("worth").innerHTML=tbl(["Sessions a month","num:They pay","num:They get","num:Better off by"],p.kind==="block"

    :rows.map(r=>'<tr><td>'+r.n+(r.n>S?' '+chip("not possible","stop"):"")+'</td><td class="num">'+gbp(r.pays)+'</td><td class="num">'+gbp(r.gets)+'</td><td class="num '+(r.net>0?"aoc-go-c":r.net===0?"aoc-warn-c":"aoc-stop-c")+'">'+gbpS(r.net)+'</td></tr>').join(""));
  g("worthNote").textContent="Against a "+gbp(T)+" "+d.labels.walkon.toLowerCase()+" ticket, "+(p.kind==="sub"&&p.per==="year"?"the price spread over twelve months":"per month");
  const v=g("verdict");
  if(p.kind==="free"){v.className="aoc-verdict go";v.innerHTML='<h4>Nothing to lose</h4><p class="aoc-small">A free account costs nobody anything and gets the safety form on file. Every other plan is sold from inside it.</p>';}
  else if(p.kind==="block"){const save=p.days*T-p.price,per=p.price/(p.days||1);v.className="aoc-verdict "+(save>0?"go":"stop");v.innerHTML='<h4>'+(save>0?"Worth buying":"Costs more than paying per day")+'</h4><p class="aoc-small">'+gbp(per)+' a day against '+gbp(T)+'. They save '+gbp(Math.abs(save))+' over the block, and you have the money at the start of the season rather than a day at a time. No monthly billing, no failed cards, nobody to win back.</p>';}
  else{const w2=planWorth(p,S,T),monthly=p.per==="year"?p.price/12:p.price,perS=p.unlim?T:(+p.disc||0)+(+p.bbs||0),be=perS>0?(monthly-(+p.guests||0)*10)/perS:Infinity;
    if(w2.gets>w2.pays*1.2){v.className="aoc-verdict go";v.innerHTML='<h4>Worth buying</h4><p class="aoc-small">At '+S+' sessions a month a member is '+gbp(w2.gets-w2.pays)+' better off. Break-even lands at '+(be<=0?"the first session":be.toFixed(1)+" sessions a month")+', which is inside what your calendar offers.</p>';}
    else if(w2.gets>=w2.pays){v.className="aoc-verdict warn";v.innerHTML='<h4>Barely worth it</h4><p class="aoc-small">A member who plays every single running day is only '+gbp(w2.gets-w2.pays)+' better off, and anyone who misses one is out of pocket. People work this out and cancel.</p>';}
    else{v.className="aoc-verdict stop";v.innerHTML='<h4>This costs members money</h4><p class="aoc-small">Break-even needs '+(be===Infinity?"more value than the plan gives":be.toFixed(1)+" sessions a month")+', and only '+S+' exist. Even playing every running day they are '+gbp(w2.pays-w2.gets)+' down. Do not sell this: a discount capped by how often you open cannot beat the fee.</p>';}}
  const w=planWorth(p,S,T),mrr=p.kind==="sub"?(p.per==="year"?p.price/12:p.price):0;
  g("biz").innerHTML=(p.kind==="block"?kv("Cash up front",gbp(p.price))+kv("Tickets given up",gbp(p.days*T))+kv("Discount you are giving",gbp(p.days*T-p.price))+kv("Paid before they play",'<span class="aoc-go-c">Yes</span>')
    :p.kind==="free"?kv("Accounts",(p.members||0).toLocaleString("en-GB"))+kv("Revenue","None directly")+kv("Worth","Forms, history, a list")
    :kv("Per member, per month",gbp(mrr))+kv("Value handed over",gbp(w.gets))+kv("Net to you",'<span class="'+(mrr-w.gets>=0?"aoc-go-c":"aoc-stop-c")+'">'+gbpS(mrr-w.gets)+'</span>')+kv("At "+(p.members||0)+" members",gbp(mrr*(p.members||0))+"/mo"))+
    '<p class="aoc-tiny" style="margin-top:10px">Our platform fee applies to whatever the plan collects.</p>';
}

/* ---------- Money ---------- */
function drawMoney(inst){
  const d=inst.data,m=inst.m,MO=d.money,W=ticketFor(inst.data,"walkon","full");
  const lines=MO.lines.length?MO.lines:[[d.labels.walkon+" tickets",m.players.filter(p=>p.kind==="walkon").length+" players, paid ahead",m.players.filter(p=>p.kind==="walkon").reduce((a,p)=>a+p.price,0)*3],[d.labels.hire,"booked and paid before the day",m.players.filter(p=>p.kind==="hire").reduce((a,p)=>a+p.price,0)*3],["Membership",MO.joinedToday+" joined at the checkout",MO.joinedToday*d.membership.price],["Pre-orders",d.preorders.map(p=>p.label.toLowerCase()).join(", "),m.preTotal*3],["Vouchers","switched off in this proposal",0]];
  const total=lines.reduce((a,l)=>a+(+l[2]||0),0), pf=Math.round(total*(MO.platformFeePct||0.02)), cardFee=MO.cardFees||Math.round(total*0.015+total/W.price*0.2);
  const payouts=MO.payouts.length?MO.payouts:[["Last "+d.calendar.regular.dayName,"two days later",Math.round(total*0.3),"paid"],["The one before","two days later",Math.round(total*0.34),"paid"],["Next "+d.calendar.regular.dayName,"two days after",0,"expected"]];
  const pending=payouts.find(p=>p[3]!=="paid"), nextPay=pending||payouts[payouts.length-1], payLabel=pending?"Next payout":"Last payout";
  const kindName=d.wedge.kind==="platform"&&d.wedge.name?d.wedge.name:"";
  const onTicket=Math.round((W.price*0.015+0.2+W.price*(MO.platformFeePct||0.02))*100)/100;
  const platTake=kindName?Math.round((W.price*(d.wedge.feePct||0)/100+(d.wedge.feePer||0))*100)/100:0;
  body(inst,"money").innerHTML=head("Money","Paid straight into your own Stripe account, line by line",'<button class="aoc-btn g" data-aoc-act="export">Export</button>')+
    '<div class="aoc-tiles">'+tile("Taken this month",gbp(total),"key","so far, across every line")+tile(payLabel,gbp(nextPay[2]||Math.round(total*0.3)),"good",esc(nextPay[0])+", "+(pending?"due ":"paid ")+esc(nextPay[1]))+tile("Card fees",gbp(cardFee),"","roughly 1.5% plus 20p, unavoidable")+tile("Platform fee",gbp(pf),"",Math.round((MO.platformFeePct||0.02)*100)+"% of everything collected")+'</div>'+
    '<div class="aoc-grid two">'+
      '<div class="aoc-stack">'+card('<h3>Takings by line, this month so far</h3>',tbl(["Line","What it was","num:Amount"],lines.map(l=>'<tr><td>'+esc(l[0])+'</td><td class="aoc-tiny">'+esc(l[1])+'</td><td class="num">'+(l[2]?gbp(l[2]):'<span class="aoc-tiny">nil</span>')+'</td></tr>').join("")+'<tr><td><b>Total</b></td><td></td><td class="num"><b>'+gbp(total)+'</b></td></tr>')+'<div class="aoc-bd"><p class="aoc-tiny">Vouchers are in the proposal but switched off, so the line reads nil until you say yes.</p></div>')+
        card('<h3>Card against cash</h3>','<div class="aoc-bd"><span class="aoc-lbl">How you take it today</span><div class="aoc-bar"><i class="cash" style="width:100%"></i></div><span class="aoc-tiny">'+esc(d.settings.todayTake)+' 100%, card 0%. Counted at the gate, reconciled by hand.</span><div style="margin-top:14px"><span class="aoc-lbl">A '+esc(d.calendar.regular.dayName)+' in this proposal</span><div class="aoc-bar"><i class="card" style="width:88%"></i><i class="cash" style="width:12%"></i></div><span class="aoc-tiny">Card 88% before the gates open, cash 12% from walk-ups on the day. Nothing stops you taking cash from a walk-up. The point is that the memberships, the deposits and the pre-orders arrive before anyone has parked.</span></div></div>')+'</div>'+
      '<div class="aoc-stack">'+card('<h3>Stripe payouts</h3>',tbl(["Covering","Paid on","num:Amount","Status"],payouts.map(p=>'<tr><td>'+esc(p[0])+'</td><td class="aoc-mono">'+esc(p[1])+'</td><td class="num">'+(p[2]?gbp(p[2]):"")+'</td><td>'+(p[3]==="paid"?chip("Paid","go"):chip(p[3],"info"))+'</td></tr>').join(""))+'<div class="aoc-bd"><p class="aoc-tiny">Stripe pays out on a rolling schedule you set once. The days shown are sample.</p></div>')+
        card('<h3>What it costs to take money</h3>','<div class="aoc-bd">'+kv("Card processing","1.5% + 20p")+kv("Platform fee",Math.round((MO.platformFeePct||0.02)*100)+"% of everything collected")+kv("Total on a "+gbp(W.price)+" ticket",gbp2(onTicket))+(kindName?kv("What "+esc(kindName)+" takes on the same ticket",'<span class="aoc-stop-c">'+gbp2(platTake)+(d.wedge.paysBy==="customer"?", added at the checkout":"")+'</span>'):kv("What you pay today",'<span class="wrap">Nothing, and nothing arrives before the day</span>',"wrap"))+kv("Applies to",'<span class="wrap">Tickets, membership, pre-orders, deposits</span>',"wrap")+'<p class="aoc-small aoc-muted" style="margin-top:12px">Refunds return the platform fee. Money arrives within days of the booking, not after the event.</p></div>')+'</div>'+
    '</div>';

    card('<h3>Products</h3><span class="aoc-sp"></span>'+chip("Free stock = on hand, minus what is already promised")+'<button class="aoc-btn p sm" data-aoc-act="addProduct">Add a product</button>',tbl(["Item","Sold as","num:Price","num:On hand","num:Reserved","num:Free","Status"],rows))+
    '<div class="aoc-grid two" style="margin-top:14px">'+
      card('<h3>To pick before '+esc(d.calendar.regular.dayName)+'</h3><span class="aoc-sp"></span>'+chip(d.preorders.reduce((a,p)=>a+p.n,0)+" items paid for","brand")+'<button class="aoc-btn g sm" data-aoc-act="printPick">Print picking list</button>','<div data-aoc="pre">'+d.preorders.map(p=>'<div class="aoc-kv" data-aoc-pre="'+esc(p.key)+'"><span><b>'+p.n+' × '+esc(p.label)+'</b><br><span class="aoc-lbl">'+p.n+' × '+gbp2(p.price)+', name on the bag</span></span><button class="aoc-btn g sm" data-aoc-act="bag" data-key="'+esc(p.key)+'">Bagged</button></div>').join("")+'</div>'+tbl(["Item","For","num:Qty","Picked"],pick.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="num">'+r[2]+'</td><td>'+(r[3]?chip("Picked","go"):chip("Waiting","warn"))+'</td></tr>').join(""))+'<div class="aoc-bd"><p class="aoc-small aoc-muted">Pre-ordered items are picked, bagged with the player\'s name and handed over at the safe zone. The stock came off the shelf the moment they paid, so it cannot be sold twice. Pre-orders this '+esc(d.calendar.regular.dayName)+': <b class="aoc-mono">'+gbp(m.preTotal)+'</b>, none of it counted in cash.</p></div>')+
      card('<h3>Stock movements</h3>',tbl(["When","Item","What happened","num:Change"],[["Today 09:14",S[0]?S[0].item:"BBs","Issued at the safe zone","-3","stop"],["Today 08:52",S[1]?S[1].item:"Gas","Issued at the safe zone","-1","stop"],["Fri 16:30",S[0]?S[0].item:"BBs","Delivery received","+20","go"],["Thu 21:06",S[2]?S[2].item:"Lunch","Pre-ordered online","Reserved 2",""],["Wed 12:40",S[1]?S[1].item:"Gas","Stock take correction","-2","stop"]].map(r=>'<tr><td class="aoc-mono">'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+r[2]+'</td><td class="num '+(r[4]==="stop"?"aoc-stop-c":r[4]==="go"?"aoc-go-c":"")+'">'+r[3]+'</td></tr>').join(""))+'<div class="aoc-bd"><p class="aoc-small aoc-muted">Every movement is logged, so the number on the screen and the number on the shelf stay the same, and a discrepancy has a history to look at.</p></div>')+
    '</div>';
}

    '<div data-aoc="okPane" hidden><div class="aoc-bigok"><div class="aoc-tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 10 18 20 6"/></svg></div><h2 data-aoc="okName"></h2><p class="aoc-muted" data-aoc="okSub"></p><div class="aoc-row" style="justify-content:center">'+chip("Form signed","go")+'<span class="aoc-chip info" data-aoc="okKit"></span></div><button class="aoc-btn g" data-aoc-act="okNext" style="margin-top:8px">Next person</button></div></div>'+

function paintReception(inst){

function checkIn(inst,p){
  p.in=true;p.arrived=true;p.reg=p.reg||REGS[p.id%REGS.length];p.waiver=true;

}

function rCalc(inst){
  const d=inst.data,W=ticketFor(d,"walkon","full"),H=ticketFor(d,"hire","full")||W,MO=d.model,wg=d.wedge,g=k=>q('[data-aoc="'+k+'"]',inst.el),v=k=>+(q('[data-aoc-model="'+k+'"]',inst.el)||{value:0}).value;
  if(!g("rTotal"))return;
  const pl=v("players"),ms=v("memShare")/100,hs=v("hire")/100,mem=v("members"),grp=v("groups"),att=v("attach")/100;
  g("playersOut").textContent=pl;g("memShareOut").textContent=pc(ms);g("hireOut").textContent=pc(hs);g("membersOut").textContent=mem;g("groupsOut").textContent=grp;g("attachOut").textContent=pc(att);
  const avgTicket=(1-hs)*(ms*W.member+(1-ms)*W.price)+hs*(ms*H.member+(1-ms)*H.price);
  const tickets=MO.days*pl*avgTicket,memRev=mem*d.membership.price*(d.membership.per==="month"?12:1),add=MO.days*pl*att*MO.addAvg,grpRev=grp*MO.groupAvg,total=tickets+memRev+add+grpRev;
  g("rTickets").textContent=gbp(tickets);g("rMem").textContent=gbp(memRev);g("rAdd").textContent=gbp(add);g("rGrp").textContent=gbp(grpRev);g("rTotal").textContent=gbp(total);
  g("rDelta").textContent=gbp(add+grpRev)+" of that is new and collected online, and "+gbp(tickets+memRev)+" moves from "+d.settings.todayTake+" to card.";
  /* the platform cost, off the same volumes */
  const fee=k=>parseFloat((q('[data-aoc-fee="'+k+'"]',inst.el)||{value:0}).value)||0;
  const tix=MO.days*pl,gross=tickets,pct=fee("pct"),per=fee("per"),pf=gross*fee("pf")/100,card=gross*0.015+tix*0.20,fees=gross*pct/100+tix*per;
  const isPlat=wg.kind==="platform"&&wg.name;
  g("ebTix").textContent=Math.round(tix).toLocaleString("en-GB");g("ebGross").textContent=gbp(gross);if(g("ebFee"))g("ebFee").textContent=gbp(fees);g("pfFee").textContent=gbp(pf);g("ebCard").textContent=gbp(card);
  const net=isPlat?fees-pf:(add+grpRev+memRev)-pf-card*((add+grpRev+memRev)/Math.max(1,total));
  g("ebSave").textContent=gbp(net);g("ebMonth").textContent=gbp(net/12);g("ebDay").textContent=gbp(net/Math.max(1,MO.days));
  const who=(q('input[name="aoc-who"]:checked',inst.el)||{}).value||"absorb";
  qa("[data-aoc-who]",inst.el).forEach(l=>l.classList.toggle("sel",l.dataset.aocWho===who));
  g("ebLine").textContent=isPlat?(who==="absorb"?"After our platform fee. Money that currently leaves the business for good, and now mostly stays in it.":"Your advertised "+gbp(W.price)+" day rings up at "+gbp2(W.price*(1+pct/100)+per)+" at their checkout. On your own system it rings up at "+gbp(W.price)+"."):"The new lines (memberships, pre-orders and deposited group bookings) after our fee and their share of card processing. The tickets you already take are not counted as new.";
}

function live(inst,on,L){

  else if(inst._liveSaved){P.forEach((p,i)=>{[p.arrived,p.in]=inst._liveSaved[i];});inst._liveSaved=null;}
  const c=q('[data-aoc="liveChip"]',inst.el);if(c){c.hidden=!on;c.textContent="Live "+LV.time+" · game "+LV.game+" of "+LV.of+" · "+(LV.onSite||P.length)+" on site";}

}
