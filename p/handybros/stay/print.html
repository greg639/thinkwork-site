<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print the welcome card · demo for HandyBros</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
  @page { size: A5 portrait; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  :root { --ink: #0B1E2D; --door: #E0A92B; --paper: #FFFCF6; }
  body { margin: 0; background: #DDD6C7; color: var(--ink); font: 400 14px/1.5 'Geist', ui-sans-serif, system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; padding: 14px 16px; background: var(--ink); color: #F3EEE4; }
  .bar p { margin: 0; font-size: 14px; }
  .bar button, .bar a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 12px; background: var(--door); color: var(--ink); font: 600 15px/1 'Geist', sans-serif; border: 0; text-decoration: none; cursor: pointer; }
  .bar a.q { background: transparent; color: #F3EEE4; border: 1.5px solid rgb(243 238 228 / .5); }
  .stage { display: grid; place-items: center; padding: 28px 12px 40px; }
  .card { width: 148mm; height: 210mm; background: var(--paper); position: relative; padding: 10mm; box-shadow: 0 20px 50px -20px rgb(11 30 45 / .5); }
  .frame { height: 100%; border: 1.2mm solid var(--ink); outline: .5mm solid var(--ink); outline-offset: 1.6mm; position: relative; display: flex; flex-direction: column; align-items: center; padding: 9mm 8mm 8mm; text-align: center; }
  .frame::before, .frame::after { content: ''; position: absolute; left: 50%; width: 22mm; height: 3mm; margin-left: -11mm; background: var(--door); }
  .frame::before { top: -2.1mm; }
  .frame::after { bottom: -2.1mm; }
  .mark { display: inline-grid; place-items: center; width: 10mm; height: 10mm; border-radius: 2mm; background: var(--door); color: var(--ink); font: 500 9pt/1 'Geist Mono', monospace; }
  .eyebrow { font: 500 7.5pt/1 'Geist Mono', monospace; letter-spacing: .16em; text-transform: uppercase; margin-top: 4mm; }
  h1 { font: 500 31pt/1.02 'Fraunces', Georgia, serif; letter-spacing: -.02em; margin: 6mm 0 0; font-variation-settings: 'opsz' 144; text-wrap: balance; }
  .qr { width: 78mm; height: 78mm; margin: 8mm 0 0; padding: 3mm; background: #fff; border: .4mm solid var(--ink); }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .name { font: 500 19pt/1.1 'Fraunces', Georgia, serif; margin: 8mm 0 0; font-variation-settings: 'opsz' 72; }
  .hint { margin: 2.5mm 0 0; font-size: 10.5pt; }
  .wifi { margin-top: auto; font: 500 8.5pt/1.4 'Geist Mono', monospace; padding: 2.5mm 4mm; border: .35mm dashed var(--ink); border-radius: 2mm; }
  .demo { margin: 3mm 0 0; font: 400 7pt/1.3 'Geist Mono', monospace; opacity: .7; }
  @media print {
    body { background: none; }
    .bar { display: none; }
    .stage { padding: 0; display: block; }
    .card { box-shadow: none; margin: 0; page-break-after: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 600px) { .card { zoom: .6; } }
</style>
</head>
<body>
<div class="bar"><p>Print this on A5. Frame it and keep it inside the front door.</p><button type="button" id="print">Print the card</button><a class="q" id="back" href="index.html">Open the guest page</a></div>
<div class="stage">
  <article class="card" aria-label="Welcome card">
    <div class="frame">
      <span class="mark" aria-hidden="true">HB</span>
      <div class="eyebrow">Welcome</div>
      <h1>Scan for your welcome guide</h1>
      <div class="qr"><img id="qr" alt="QR code that opens the welcome guide" src="qr-yellow-door.svg"></div>
      <div class="name" id="name">The Yellow Door</div>
      <p class="hint">Point your phone camera at the code.</p>
      <div class="wifi" id="wifi">Wifi details are in the guide</div>
      <p class="demo">Demo card made for HandyBros</p>
    </div>
  </article>
</div>
<script src="js/data.js"></script>
<script>
  (function () {
    var D = window.StayData, p = new URLSearchParams(location.search).get('p') || 'yellow-door';
    if (!D.has(p)) p = 'yellow-door';
    var d = D.load(p);
    document.getElementById('qr').src = 'qr-' + p + '.svg';
    document.getElementById('name').textContent = d.name;
    var ssid = d.wifi && String(d.wifi.ssid || '').trim();
    document.getElementById('wifi').textContent = ssid ? 'Wifi network: ' + ssid + '. The password is in the guide.' : 'Wifi details are in the guide';
    document.getElementById('back').href = 'index.html?p=' + encodeURIComponent(p);
    document.getElementById('print').addEventListener('click', function () { window.print(); });
  })();
</script>
</body>
</html>
